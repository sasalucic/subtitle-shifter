<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Subtitle Shifter</title>
  <style>
    :root{--bg:#0f1115;--card:#171a21;--muted:#8f98a8;--text:#f5f7fb;--accent:#4f8cff;--line:#2a2f3a}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .wrap{max-width:900px;margin:auto;padding:18px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    h1{font-size:24px;margin:0 0 6px}.sub,.tiny{color:var(--muted)}.sub{margin-bottom:18px;font-size:14px}.tiny{font-size:12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
    input,button,select{font:inherit}input,select{background:#0f131a;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
    input{width:100%}button{border:0;border-radius:12px;padding:12px 10px;background:#252b36;color:var(--text);font-weight:650;cursor:pointer}
    button.primary{background:var(--accent)}button.danger{background:#3a2025;color:#ffd6db}button:disabled{opacity:.45}
    .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .filelist{max-height:48vh;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px}.file{padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
    .file:hover,.file.active{background:#202632}.fname{font-weight:650;display:flex;align-items:center;gap:8px}.type,.langbadge{font-size:10px;padding:3px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
    .langbadge{text-transform:uppercase}.original{color:#b9c2d0;font-size:11px;margin-top:4px;word-break:break-all}.folder{color:var(--muted);font-size:12px;margin-top:3px;word-break:break-all}.selected{word-break:break-all;font-size:14px;color:#dce5f5}
    .status{margin-top:10px;padding:10px;border-radius:10px;display:none}.status.ok{display:block;background:#173224;color:#bdf0cf}.status.err{display:block;background:#3a2025;color:#ffd1d7}
    pre{white-space:pre-wrap;word-break:break-word;background:#0e1117;padding:12px;border-radius:12px;border:1px solid var(--line);max-height:32vh;overflow:auto;font-size:12px}
    .topright{display:flex;align-items:center;gap:10px}.badge{font-size:12px;color:var(--muted)}
    @media(max-width:640px){.row{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.topright{flex-direction:column;align-items:flex-end}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="topline">
    <div><h1>Subtitle Shifter</h1><div id="subtitle" class="sub"></div></div>
    <div class="topright">
      <select id="languageSelect"><option value="en">English</option><option value="sr">Srpski</option></select>
      <div class="badge">v{{ version }}</div>
    </div>
  </div>

  <div class="card">
    <input id="search" type="search">
    <div id="count" class="tiny" style="margin-top:8px"></div>
    <div id="files" class="filelist"></div>
  </div>

  <div class="card">
    <div id="selectedLabel" class="tiny"></div>
    <div id="selected" class="selected" style="margin:6px 0 14px"></div>
    <div class="quick">
      <button data-ms="-5000">−5 s</button><button data-ms="-2000">−2 s</button>
      <button data-ms="-1000">−1 s</button><button data-ms="-500">−0.5 s</button>
      <button data-ms="500">+0.5 s</button><button data-ms="1000">+1 s</button>
      <button data-ms="2000">+2 s</button><button data-ms="5000">+5 s</button>
    </div>
    <div class="row" style="margin-top:12px">
      <div><div id="customLabel" class="tiny" style="margin-bottom:6px"></div><input id="custom" type="number" step="0.1"></div>
      <div style="display:flex;align-items:end"><button id="applyCustom" class="primary" style="width:100%"></button></div>
    </div>
    <div class="row" style="margin-top:10px"><button id="previewBtn"></button><button id="restoreBtn" class="danger"></button></div>
    <div id="status" class="status"></div>
  </div>

  <div class="card"><div id="previewLabel" class="tiny" style="margin-bottom:8px"></div><pre id="preview"></pre></div>
</div>

<script>
const translations={
en:{subtitle:"Shift SRT and VTT subtitles without manually typing file paths.",searchPlaceholder:"Search movie, show, season, episode or StreamPort subtitle...",subtitlesCount:n=>`${n} subtitle${n===1?"":"s"}`,loading:"Loading...",selectedLabel:"Selected subtitle",noneSelected:"No file selected.",backupExists:"backup exists",customLabel:"Custom offset (seconds)",customPlaceholder:"e.g. -1.7 or 2.3",applyCustom:"Apply custom",previewButton:"Preview subtitle",restoreButton:"Restore original (.bak)",previewLabel:"Preview",previewEmpty:"Select a subtitle and click Preview.",selectFirst:"Select an SRT or VTT file first.",enterNumber:"Enter a number of seconds, e.g. -1.5 or 2.0.",shifted:(s,c,b,t)=>`${t} shifted by ${s.toFixed(3)} s • ${c} timestamps changed • backup: ${b}`,restored:"Original subtitle restored from .bak.",loadFailed:"Could not load subtitle list",errors:{INVALID_PATH:"Invalid path.",SUBTITLE_NOT_FOUND:"Subtitle file was not found or its format is unsupported.",READ_FAILED:"Could not read subtitle file.",INVALID_REQUEST:"Invalid request.",NO_TIMESTAMPS:"No supported subtitle timestamps were found.",WRITE_PERMISSION:"No write permission for this file. Check Docker volume/file permissions.",WRITE_FAILED:"Failed to write subtitle file.",BACKUP_NOT_FOUND:"No backup exists for this subtitle.",RESTORE_FAILED:"Failed to restore backup.",UNKNOWN:"An unexpected error occurred."}},
sr:{subtitle:"Pomjeri SRT i VTT titlove bez ručnog kucanja putanja.",searchPlaceholder:"Traži film, seriju, sezonu, epizodu ili StreamPort titl...",subtitlesCount:n=>`${n} titlova`,loading:"Učitavanje...",selectedLabel:"Odabrani titl",noneSelected:"Nijedan fajl nije odabran.",backupExists:"backup postoji",customLabel:"Custom offset (sekunde)",customPlaceholder:"npr. -1.7 ili 2.3",applyCustom:"Primijeni custom",previewButton:"Preview titla",restoreButton:"Vrati original (.bak)",previewLabel:"Preview",previewEmpty:"Odaberi titl i klikni Preview.",selectFirst:"Prvo odaberi SRT ili VTT fajl.",enterNumber:"Unesi broj sekundi, npr. -1.5 ili 2.0.",shifted:(s,c,b,t)=>`${t} pomjeren za ${s.toFixed(3)} s • promijenjeno ${c} timestampova • backup: ${b}`,restored:"Originalni titl vraćen iz .bak fajla.",loadFailed:"Ne mogu učitati listu titlova",errors:{INVALID_PATH:"Neispravna putanja.",SUBTITLE_NOT_FOUND:"Titl nije pronađen ili format nije podržan.",READ_FAILED:"Ne mogu pročitati titl.",INVALID_REQUEST:"Neispravan zahtjev.",NO_TIMESTAMPS:"Nisu pronađeni podržani timestampovi.",WRITE_PERMISSION:"Nema prava pisanja nad fajlom. Provjeri Docker volume/file permissions.",WRITE_FAILED:"Greška pri pisanju titla.",BACKUP_NOT_FOUND:"Backup ne postoji za ovaj titl.",RESTORE_FAILED:"Greška pri vraćanju backupa.",UNKNOWN:"Dogodila se neočekivana greška."}}
};
let allFiles=[],selectedPath=null,currentLanguage=localStorage.getItem("subtitle-shifter-language")||(((navigator.language||"en").toLowerCase().match(/^(sr|bs|hr)/))?"sr":"en");
const $=id=>document.getElementById(id),filesEl=$("files"),statusEl=$("status"),t=()=>translations[currentLanguage];
function esc(s){return(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function err(j){return t().errors[j?.error_code||"UNKNOWN"]||t().errors.UNKNOWN}
function status(m,ok=true){statusEl.className="status "+(ok?"ok":"err");statusEl.textContent=m}
function lang(){let x=t();document.documentElement.lang=currentLanguage==="sr"?"sr":"en";$("languageSelect").value=currentLanguage;$("subtitle").textContent=x.subtitle;$("search").placeholder=x.searchPlaceholder;$("selectedLabel").textContent=x.selectedLabel;$("customLabel").textContent=x.customLabel;$("custom").placeholder=x.customPlaceholder;$("applyCustom").textContent=x.applyCustom;$("previewBtn").textContent=x.previewButton;$("restoreBtn").textContent=x.restoreButton;$("previewLabel").textContent=x.previewLabel;if(!selectedPath){$("selected").textContent=x.noneSelected;$("preview").textContent=x.previewEmpty}render()}
function render(){let x=t(),q=$("search").value.trim().toLowerCase(),a=allFiles.filter(f=>[f.path,f.name,f.display_name,f.media_title,f.episode_title,f.subtitle_language].filter(Boolean).join(" ").toLowerCase().includes(q));$("count").textContent=x.subtitlesCount(a.length);filesEl.innerHTML=a.map(f=>`<div class="file ${selectedPath===f.path?'active':''}" data-path="${encodeURIComponent(f.path)}"><div class="fname"><span>${esc(f.display_name||f.name)}</span><span class="type">${esc(f.type||"")}</span>${f.subtitle_language?`<span class="langbadge">${esc(f.subtitle_language)}</span>`:""}</div>${f.display_name&&f.display_name!==f.name?`<div class="original">${esc(f.name)}</div>`:""}<div class="folder">${esc(f.folder||"/")}${f.has_backup?` • ${x.backupExists}`:""}</div></div>`).join("");filesEl.querySelectorAll(".file").forEach(e=>e.onclick=()=>{selectedPath=decodeURIComponent(e.dataset.path);let f=allFiles.find(x=>x.path===selectedPath);$("selected").textContent=f&&f.display_name&&f.display_name!==f.name?`${f.display_name} — ${f.name}`:selectedPath;render();preview()})}
async function load(){let r=await fetch("/api/files"),j=await r.json();if(!j.ok)throw Error(err(j));allFiles=j.files||[];render()}
async function preview(){if(!selectedPath)return;let r=await fetch("/api/preview?path="+encodeURIComponent(selectedPath)),j=await r.json();if(j.ok){$("preview").textContent=j.preview;$("restoreBtn").disabled=!j.has_backup}else $("preview").textContent=err(j)}
async function shift(ms){if(!selectedPath)return status(t().selectFirst,false);let r=await fetch("/api/shift",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:selectedPath,delta_ms:ms})}),j=await r.json();if(j.ok){status(t().shifted(j.delta_ms/1000,j.timestamps_changed,j.backup,j.type));await load();await preview()}else status(err(j),false)}
document.querySelectorAll("[data-ms]").forEach(b=>b.onclick=()=>shift(parseInt(b.dataset.ms,10)));
$("applyCustom").onclick=()=>{let v=parseFloat($("custom").value);Number.isNaN(v)?status(t().enterNumber,false):shift(Math.round(v*1000))};
$("previewBtn").onclick=preview;
$("restoreBtn").onclick=async()=>{if(!selectedPath)return status(t().selectFirst,false);let r=await fetch("/api/restore",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:selectedPath})}),j=await r.json();if(j.ok){status(t().restored);await load();await preview()}else status(err(j),false)};
$("search").oninput=render;$("languageSelect").onchange=e=>{currentLanguage=e.target.value;localStorage.setItem("subtitle-shifter-language",currentLanguage);lang()};
lang();load().catch(e=>status(`${t().loadFailed}: ${e.message}`,false));
</script>
</body>
</html>
